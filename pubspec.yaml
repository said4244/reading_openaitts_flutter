name: arabic_tts_reader
description: A Flutter package for TTS reading exercises using OpenAI TTS streaming API and LiveKit
version: 0.1.0
homepage: https://github.com/yourusername/arabic_tts_reader

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # LiveKit for WebRTC audio streaming
  livekit_client: ^2.4.7
  
  # HTTP for token fetching
  http: ^1.4.0
  
  # Logging
  logger: ^2.5.0
  
  # Web support
  web: ^1.1.1
  flutter_webrtc: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: ArabicTTSReaderWeb
        fileName: arabic_tts_reader_web.dart